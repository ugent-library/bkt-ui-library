<!-- @example: /patterns/people-search.html#checkable-rich-rows -->
<!--
  Partial: people-picker-panel.html
  The people picker: a search box over checkable rich rows. Two hosts pick several people at
  once, the works Author filter and the query builder's Person condition. Picking a person is
  one act, so both clone this one panel.

  Include once per page carrying either host, alongside filter-editor-templates.html.

  A row is identified by its data-id, never by the name in its label: two people share a name,
  which is what the rich row exists to tell apart. data-person-external marks a person the index
  knows without a UGent person record behind them.

  Placeholder people, mirroring the PEOPLE array in people-search-stub.js. In production a row
  comes from /people/search, which returns UGent people and index-known external people alike.
-->
