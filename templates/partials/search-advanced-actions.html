<!--
  Used with search-advanced-conditions.html; the submit reaches that form through form="qb-form".
  A count button is the builder's aria-live region.
-->
<div class="bt-toolbar">
  <div class="bt-toolbar__right">
    <!-- Clear all sits beside the exit because both leave the current query. -->
    <!-- @state: builder-fields builder-one-condition explore-more-fields explore-or-groups explore-spelling results best-bet no-results no-query default direct-added no-matches -->
    <button type="button" class="btn btn-ghost" data-qb-clear>
      <i class="if if-close" aria-hidden="true"></i>
      Clear all
    </button>
    <!-- @state -->
    <!-- @state: builder-empty builder-one-condition builder-fields builder-query-language explore-or-groups explore-more-fields results best-bet no-results no-query -->
    <button type="submit" form="qb-form" class="btn btn-primary">
      <i class="if if-search" aria-hidden="true"></i>
      Show results
    </button>
    <!-- @state -->
    <!-- @state: default direct-added no-matches -->
    <button type="submit" form="qb-form" class="btn btn-primary" aria-live="polite">
      <i class="if if-search" aria-hidden="true"></i>
      <span data-qb-count>Show &plusmn; 1&thinsp;280 results</span>
    </button>
    <!-- @state -->
    <!-- @state: explore-spelling -->
    <button type="submit" form="qb-form" class="btn btn-primary" aria-live="polite" disabled>
      <i class="if if-search" aria-hidden="true"></i>
      <span data-qb-count>No results</span>
    </button>
    <!-- @state -->
  </div>
</div>
