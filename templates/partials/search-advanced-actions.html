<!--
  The Advanced search exit bar: approximate count + the one exit. Used with
  search-advanced-conditions.html; the submit reaches that form by form="qb-form".

  The bar carries no chrome. The host decides what it sits on and what borders it: the page puts
  it under the builder's box, the dialog puts it in .modal-footer.
  The count is an approximation. The exact set is the results page's job. This is the only
  aria-live region in the builder.

  Two of the four strings are too long for a 390px screen, so they carry a short form for
  narrow widths. Both spans live in the one aria-live region; display:none keeps the hidden
  one out of the announcement.
-->
<div class="bt-toolbar">
  <div class="bt-toolbar__right">
    <!-- Beside the exit, not beside Add a condition: clearing and showing results are both ways
         of leaving the query you have, so they sit together. Absent while there is nothing to
         clear. -->
    <!-- @state: built advanced-group advanced-prefilled advanced-zero results best-bet no-results query-empty advanced-condition -->
    <button type="button" class="btn btn-ghost" data-qb-clear>
      <i class="if if-close" aria-hidden="true"></i>
      Clear all
    </button>
    <!-- @state -->
    <!-- @state: advanced-prefilled -->
    <button type="submit" form="qb-form" class="btn btn-primary">
      <i class="if if-search" aria-hidden="true"></i>
      Show ± 240 results
    </button>
    <!-- @state -->
    <!-- @state: advanced-empty -->
    <button type="submit" form="qb-form" class="btn btn-primary">
      <i class="if if-search" aria-hidden="true"></i>
      Show ± 312&thinsp;000 results
    </button>
    <!-- @state -->
    <!-- @state: built advanced-group results best-bet no-results query-empty advanced-condition -->
    <button type="submit" form="qb-form" class="btn btn-primary">
      <i class="if if-search" aria-hidden="true"></i>
      Show ± 1&thinsp;280 results
    </button>
    <!-- @state -->
    <!-- @state: advanced-zero -->
    <button type="submit" form="qb-form" class="btn btn-primary" disabled>
      <i class="if if-search" aria-hidden="true"></i>
      No results
    </button>
    <!-- @state -->
  </div>
</div>
