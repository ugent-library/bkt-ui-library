<!--
  HTMX partial: the form that adds one person to a work's contributors.
  GET /deposit/add-author-form into #author-form-area, from deposit-1-0-find.html and
  deposit-1-1-find.html. Cancel calls DELETE /partials/add-author-form — the same partial
  under a second name, which is drift for someone to settle.

  Canonical pattern: patterns/people-search.html — click-to-select, single select.

  "Add author" is copy, not structure. The role select decides what the person is, so a host
  adding an editor or a supervisor varies the card's label, the heading and the submit. Which
  roles exist is raven's contributor catalog, not this file.

  Prototype: people-search-stub.js is the single data source. In production the input carries
  hx-get="/people/search", the stub goes, and POST /deposit/authors returns #author-list.
-->

<section class="card mt-3" id="add-author-form"
  aria-label="Add author">
  <div class="card-body">
    <p class="h6 mb-3">Add author</p>

    <!-- ── People search widget ───────────────────────────────────────────── -->
    <div class="mb-3" data-people-search>

      <label for="author-search" class="form-label">
        Search by name or ORCID
      </label>
      <input
        type="search"
        id="author-search"
        data-ps-input
        class="form-control form-control-sm"
        placeholder="e.g. De Pauw or 0000-0002-1234-5678"
        autocomplete="off">

      <div
        data-ps-results
        class="people-results"
        role="listbox"
        aria-label="People matching your search"
        hidden>
      </div>

      <p data-ps-hint class="text-muted small mt-1 mb-0" aria-live="polite">
        Type a name to search across UGent people and external authors.
      </p>

      <!-- Selected person confirmation slot. d-flex would defeat the hidden toggle
           (display utilities beat [hidden]), so the flex row is the inner div. -->
      <div data-ps-selected hidden class="p-2 mt-2 bg-light border rounded">
        <div class="d-flex align-items-start gap-3">
          <span class="people-result__icon" aria-hidden="true">
            <i class="if if-user if--sm"></i>
          </span>
          <div class="flex-grow-1">
            <div class="people-result__name" data-ps-selected-name></div>
            <div class="people-result__meta" data-ps-selected-affiliation></div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" data-ps-clear
            aria-label="Clear selection">
            <i class="if if-close if--xs" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Hidden fields filled by people-search.js on selection -->
      <input type="hidden" data-ps-id   name="author_id"           value="">
      <input type="hidden" data-ps-name name="author_display_name" value="">

    </div>

    <!-- ── Role ────────────────────────────────────────────────────────────── -->
    <div class="mb-3">
      <label for="author-role" class="form-label">Role</label>
      <select id="author-role" name="author_role" class="form-select form-select-sm w-auto">
        <option value="author" selected>Author</option>
        <option value="editor">Editor</option>
        <option value="supervisor">Supervisor</option>
        <option value="translator">Translator</option>
      </select>
    </div>

    <!-- ── External author fallback ────────────────────────────────────────── -->
    <!--
      An unlinked author is a valid state — not an error.
      See DOMAIN-VOCABULARY.md: "An unlinked author is not an error state."
    -->
    <details class="mb-3">
      <summary class="btn btn-ghost btn-sm px-0 text-muted">
        Not in the system? Add as external author
      </summary>
      <div class="pt-3 d-flex flex-column gap-3">
        <div>
          <label for="external-first-name" class="form-label">First name</label>
          <input type="text" id="external-first-name" name="external_first_name"
            class="form-control form-control-sm" autocomplete="off">
        </div>
        <div>
          <label for="external-last-name" class="form-label">
            Last name <span class="text-danger" aria-hidden="true">*</span>
          </label>
          <input type="text" id="external-last-name" name="external_last_name"
            class="form-control form-control-sm" autocomplete="family-name" required>
        </div>
        <div>
          <label for="external-orcid" class="form-label">
            ORCID <span class="text-muted">(optional)</span>
          </label>
          <input type="text" id="external-orcid" name="external_orcid"
            class="form-control form-control-sm"
            placeholder="0000-0000-0000-0000"
            pattern="[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]">
        </div>
      </div>
    </details>

    <!-- ── Actions ─────────────────────────────────────────────────────────── -->
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary btn-sm"
        hx-post="/deposit/authors"
        hx-include="#add-author-form"
        hx-target="#author-list"
        hx-swap="innerHTML">
        <i class="if if-check if--sm" aria-hidden="true"></i>
        Add author
      </button>
      <button type="button" class="btn btn-ghost btn-sm"
        hx-delete="/partials/add-author-form"
        hx-target="#author-form-area"
        hx-swap="innerHTML">
        Cancel
      </button>
    </div>
  </div>
</section>

<!-- The host loads people-search.js, not this file: a script swapped in by HTMX never runs. -->
