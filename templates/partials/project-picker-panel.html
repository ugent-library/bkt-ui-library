<!-- @example: /patterns/filter-picker.html -->
<!-- Prototype note: the project ids are real, the rest is placeholder. Two rows share a
     title and one project carries two funders, both on purpose. -->

<template id="project-picker">
  <p class="bt-panel__title" data-picker-title>Project</p>
  <div class="bt-panel__body">
    <label class="visually-hidden" for="project-search">Search projects</label>
    <input type="search" class="form-control form-control-sm" id="project-search"
      data-picker-search placeholder="Search project, acronym, funder or programme&hellip;"
      autocomplete="off">
  </div>
  <div class="bt-panel__body bt-panel__body--checklist" role="group"
    aria-label="Projects matching your search" data-picker-rows>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="project-1"
        data-id="fwo-g012">
      <label class="form-check-label" for="project-1">
        <span class="bt-result__name" data-picker-name>Adaptive Photonic Sensing</span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Acronym: APHOS</span>
          <span class="bt-meta-list__item">Project ID: <code>01G00715</code></span>
        </span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Funder: FWO</span>
          <span class="bt-meta-list__item">Programme: Research Project</span>
        </span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="project-2"
        data-id="msca-sediment">
      <label class="form-check-label" for="project-2">
        <span class="bt-result__name" data-picker-name>Coastal Sediment Flux</span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Acronym: SEDIFLUX</span>
          <span class="bt-meta-list__item">Project ID: <code>3F004820</code></span>
        </span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Funder: European Commission</span>
          <span class="bt-meta-list__item">Programme: MSCA Postdoctoral Fellowship</span>
        </span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="project-3"
        data-id="horizon-flowmatters">
      <label class="form-check-label" for="project-3">
        <span class="bt-result__name" data-picker-name>FlowMatters</span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Project ID: <code>12B4B24N</code></span>
        </span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Funder: European Commission</span>
          <span class="bt-meta-list__item">Programme: Horizon Europe</span>
        </span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="project-4"
        data-id="iof-valorisation">
      <label class="form-check-label" for="project-4">
        <span class="bt-result__name" data-picker-name>LightLab Prototyping</span>
        <span class="bt-meta-list">

          <span class="bt-meta-list__item">Project ID: <code>41K07811</code></span>

        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Funder: Ghent University</span>
          <span class="bt-meta-list__item">Programme: IOF Valorisation</span>
        </span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="project-5"
        data-id="fwo-sb">
      <label class="form-check-label" for="project-5">
        <span class="bt-result__name" data-picker-name>Neural Speech Interfaces</span>

          <span class="bt-meta-list__item">Programme: SB PhD Fellowship</span>

      </label>
    </div>

          <span class="bt-meta-list__item">Project ID: <code>13v01221</code></span>
        </span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Funder: European Commission</span>
          <span class="bt-meta-list__item">Programme: Horizon Europe</span>
        </span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="project-7"

        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Acronym: QMEM</span>
          <span class="bt-meta-list__item">Project ID: <code>01MR0210</code></span>

    <div class="form-check">

        <span class="bt-meta-list">

          <span class="bt-meta-list__item">Programme: Research Project</span>
        </span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="project-10"
        data-id="vlaio-tetra">

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="project-11"
        data-id="horizon-urbantwin">
      <label class="form-check-label" for="project-11">
        <span class="bt-result__name" data-picker-name>Urban Climate Twins</span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Acronym: URBTWIN</span>
          <span class="bt-meta-list__item">Project ID: <code>13v20120</code></span>
        </span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Funder: European Commission</span>
          <span class="bt-meta-list__item">Programme: Horizon Europe</span>
        </span>
        <span class="bt-meta-list">
          <span class="bt-meta-list__item">Funder: FWO</span>
        </span>
      </label>
    </div>
  </div>
  <div class="bt-panel__actions" data-picker-actions>
    <button type="button" class="btn btn-primary btn-sm" data-picker-apply>Apply</button>
    <button type="button" class="btn btn-ghost btn-sm" data-picker-cancel>Cancel</button>
    <button type="button" class="btn btn-ghost btn-sm ms-auto" data-picker-clear>Clear</button>
  </div>
</template>
