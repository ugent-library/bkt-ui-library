<!--
  The Advanced search dialog, from the modal-dialog down: the chrome around the builder, and nothing
  of the page it opens over. The outer .modal element belongs to the host.

  modal-dialog-scrollable pins the header and the footer and scrolls only the body, so the form has
  to sit inside the body rather than wrapping all three. modal-dialog--wide widens it past modal-xl,
  because a condition row carries a field, sometimes a qualifier, an operator and a value.
  Layout reasoning: patterns/query-builder.html.
-->
<div class="modal-dialog modal-xl modal-dialog--wide modal-dialog-scrollable">
  <div class="modal-content">
    <div class="modal-header px-4">
      <h2 class="modal-title h4" id="advanced-search-title">Advanced search</h2>
      <button type="button" class="btn-close" data-bs-dismiss="modal"
        aria-label="Close advanced search"></button>
    </div>
    <div class="modal-body p-4">
      <h3 id="conditions-heading" class="h6">
        Show research output where all of these are true:
      </h3>

      <!-- @include: templates/partials/search-advanced-conditions.html -->
    </div>
    <!-- d-block so the actions bar spans the footer instead of being packed to one end -->
    <div class="modal-footer px-4">
      <!-- @include: templates/partials/search-advanced-actions.html -->
    </div>
  </div>
</div>
