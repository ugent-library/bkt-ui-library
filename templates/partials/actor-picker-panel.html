<!-- @example: /patterns/filter-picker.html -->
<!-- Shared markup: docs/JAVASCRIPT.md. The Changed by condition clones this: a specific
     person, any Biblio team member, or the system. Placeholder people. -->

<template id="actor-picker">
  <p class="bt-panel__title" data-picker-title>Person or system</p>
  <div class="bt-panel__body">
    <label class="visually-hidden" for="actor-search">Search people</label>
    <input type="search" class="form-control form-control-sm" id="actor-search"
      data-picker-search placeholder="Search person&hellip;" autocomplete="off">
  </div>
  <div class="bt-panel__body bt-panel__body--checklist" role="group"
    aria-label="People and system actors matching your search" data-picker-rows>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="actor-team" data-id="team">
      <label class="form-check-label" for="actor-team">
        <span data-picker-name>Any Biblio team member</span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="actor-system" data-id="system">
      <label class="form-check-label" for="actor-system">
        <span class="bt-result__name" data-picker-name>The system</span>
        <span class="bt-meta-list bt-meta-list--xs">
          <span class="bt-meta-list__item">imports, Plato</span>
        </span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="actor-1" data-id="p1" data-person-ugent>
      <label class="form-check-label" for="actor-1">
        <span data-picker-name>Marianne Testarosso</span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="actor-2" data-id="p5" data-person-ugent>
      <label class="form-check-label" for="actor-2">
        <span data-picker-name>Jan Kiewiet</span>
      </label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="actor-3" data-id="p6" data-person-ugent>
      <label class="form-check-label" for="actor-3">
        <span data-picker-name>Sarah De Wolf</span>
      </label>
    </div>
  </div>
  <div class="bt-panel__actions" data-picker-actions>
    <button type="button" class="btn btn-primary btn-sm" data-picker-apply>Apply</button>
    <button type="button" class="btn btn-ghost btn-sm" data-picker-cancel>Cancel</button>
    <button type="button" class="btn btn-ghost btn-sm ms-auto" data-picker-clear>Clear</button>
  </div>
</template>
